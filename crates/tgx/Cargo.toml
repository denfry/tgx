[package]
name = "tgx"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Lightweight Telegram client for Windows with a built-in WebSocket transport"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
minisign-verify = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
slint = "1.18.1"
tdlib-rs = { version = "1.4.0", features = ["download-tdlib"] }
tgx-transport = { version = "0.1.0", path = "../tgx-transport" }
tokio = { version = "1.54.1", features = ["full"] }
ureq = { version = "3.5.0", features = ["json"] }
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }

[build-dependencies]
slint-build = "1.18.1"
tdlib-rs = { version = "1.4.0", features = ["download-tdlib"] }
