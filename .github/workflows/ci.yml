name: ci

on:
  push:
  pull_request:

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked -p tgx-transport

  android-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest ships an NDK and exports ANDROID_NDK_LATEST_HOME.
      - run: bash scripts/check-android.sh
