<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tgx prototype</title>
<style>
:root {
  --bg:#e9e7e2; --win:#f7f6f3; --pane:#efede8; --rail:#e5e2dc; --chat:#f2f0ec;
  --line:#d9d6cf; --text:#1d1d1b; --muted:#6b6a65; --faint:#9a988f; --sel:#e2e0da;
  --in:#ffffff; --accent:#2f6f62; --accent-ink:#ffffff;
  --ok:#2f7d4f; --warn:#b7791f; --bad:#b5402f;
  --accent-soft:color-mix(in srgb, var(--accent) 14%, var(--win));
  --out:color-mix(in srgb, var(--accent) 13%, var(--in));
  --shadow:0 8px 28px -8px rgba(0,0,0,.25);
  --msg:14px;
  --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
}
:root[data-theme="dark"] {
  --bg:#0f100f; --win:#1a1b1a; --pane:#161716; --rail:#131413; --chat:#121312;
  --line:#2b2d2b; --text:#e6e5e0; --muted:#9b9a94; --faint:#6c6b66; --sel:#262826;
  --in:#222422; --accent-ink:#0e1a17;
  --ok:#6cc28b; --warn:#e0a64a; --bad:#e07a68;
  --accent-soft:color-mix(in srgb, var(--accent) 18%, var(--win));
  --out:color-mix(in srgb, var(--accent) 22%, var(--in));
  --shadow:0 10px 32px -8px rgba(0,0,0,.6);
  color-scheme:dark;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html,body { margin:0; height:100%; }
body { background:var(--bg); color:var(--text); font:14px/1.4 var(--sans); display:flex; flex-direction:column; padding:10px 16px 16px; }
button,input,textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
a { color:var(--accent); }
.i { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.no-anim *, .no-anim *::before, .no-anim *::after { transition:none !important; animation:none !important; }

/* page chrome */
.page-head { max-width:1400px; width:100%; margin:0 auto 10px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
.page-head h1 { font-size:15px; margin:0; font-weight:600; }
.page-head p { margin:0; color:var(--muted); font-size:13px; flex:1; min-width:240px; }
.pbtn { border:1px solid var(--line); background:var(--win); padding:4px 12px; border-radius:4px; font-size:13px; }
.pbtn:hover { border-color:var(--faint); }
.scroller { flex:1; min-height:0; overflow:auto; }

/* window */
.window { min-width:1060px; max-width:1400px; height:100%; min-height:620px; margin:0 auto; background:var(--win);
  border:1px solid var(--line); display:grid; grid-template-rows:32px 1fr 26px; box-shadow:0 12px 32px -14px rgba(0,0,0,.25); overflow:hidden; }
.titlebar { display:flex; align-items:center; border-bottom:1px solid var(--line); padding-left:12px; font-size:12px; color:var(--muted); user-select:none; }
.titlebar b { color:var(--text); font-weight:600; margin-right:8px; }
.caps { margin-left:auto; display:flex; height:100%; }
.caps span { width:46px; display:grid; place-items:center; }
.caps span:hover { background:var(--sel); }
.caps span:last-child:hover { background:#c42b1c; color:#fff; }
.stage { position:relative; min-height:0; display:grid; }
.app { display:grid; grid-template-columns:68px 310px minmax(0,1fr) auto; min-height:0; }

/* rail */
.rail { background:var(--rail); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:4px 0 6px; overflow-y:auto; }
.rbtn { border:0; background:none; color:var(--muted); display:grid; justify-items:center; gap:3px; padding:9px 0 8px; font-size:11px; position:relative; }
.rbtn .i { width:22px; height:22px; }
.rbtn:hover { color:var(--text); }
.rbtn.on { color:var(--accent); font-weight:600; }
.rbtn.on::before { content:""; position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:0 3px 3px 0; background:var(--accent); }
.rbtn.menu { padding:12px 0; }
.rbtn.bottom { margin-top:auto; }
.rbadge { position:absolute; top:4px; left:calc(50% + 6px); min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--accent); color:var(--accent-ink); font-size:11px; font-weight:600; display:grid; place-items:center; }

/* chat list */
.list { background:var(--pane); border-right:1px solid var(--line); display:grid; grid-template-rows:auto 1fr; min-height:0; }
.lhead { padding:10px; }
.lhead input { width:100%; border:1px solid var(--line); background:var(--win); padding:7px 10px; border-radius:6px; outline:none; }
.lhead input:focus { border-color:var(--accent); }
.chats { overflow-y:auto; }
.lsec { padding:8px 12px 4px; font-size:12px; color:var(--muted); font-weight:600; }
.lempty { padding:30px 16px; color:var(--muted); text-align:center; }
.citem { display:grid; grid-template-columns:46px minmax(0,1fr) auto; column-gap:10px; padding:7px 10px; align-items:center; cursor:default; }
.citem:hover { background:var(--sel); }
.citem.on { background:var(--accent); color:var(--accent-ink); }
.cmid { min-width:0; }
.t1 { display:flex; align-items:center; gap:4px; font-weight:600; min-width:0; }
.t1 .tt { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.t1 .i { width:14px; height:14px; color:var(--faint); }
.t2 { font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
.t2 .pfx { color:var(--text); }
.t2 em { font-style:normal; color:var(--accent); }
.t2 .draft { color:var(--bad); }
.citem.on .t1 .i, .citem.on .t2, .citem.on .t2 .pfx, .citem.on .t2 em, .citem.on .t2 .draft, .citem.on .ctm, .citem.on .acc { color:inherit; }
.citem.on .t2 { opacity:.85; }
.cr { display:grid; justify-items:end; gap:4px; align-self:stretch; padding:3px 0; }
.ctm { font-size:12px; color:var(--faint); display:flex; gap:2px; align-items:center; white-space:nowrap; }
.ctm .chk { color:var(--accent); }
.citem.on .ctm .chk { color:inherit; }
.badge { min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--accent); color:var(--accent-ink); font-size:12px; font-weight:600; display:grid; place-items:center; }
.badge.mut { background:var(--faint); color:var(--win); }
.citem.on .badge { background:var(--accent-ink); color:var(--accent); }
.cr .pinI { width:14px; height:14px; color:var(--faint); }
.citem.on .cr .pinI { color:inherit; }
.acc { color:var(--accent); }
.hit { background:color-mix(in srgb, var(--warn) 35%, transparent); border-radius:2px; }

/* avatars */
.ava { width:var(--s); height:var(--s); border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:600; font-size:calc(var(--s) * .34); flex:none; position:relative; user-select:none; }
.ava.sv { background:var(--accent); color:var(--accent-ink); }
.ava.sv .i { width:48%; height:48%; }
.ava.on::after { content:""; position:absolute; right:0; bottom:0; width:12px; height:12px; border-radius:50%; background:var(--ok); border:2px solid var(--pane); }

/* conversation */
.conv { display:grid; grid-template-rows:54px auto minmax(0,1fr) auto auto auto; min-height:0; min-width:0; background:var(--chat); }
.chead { display:flex; align-items:center; gap:12px; padding:0 8px 0 16px; border-bottom:1px solid var(--line); background:var(--win); min-width:0; }
.who { cursor:pointer; line-height:1.25; min-width:0; }
.who .wt { font-weight:600; display:flex; gap:5px; align-items:center; }
.who .wt .i { width:14px; height:14px; color:var(--faint); }
.who .ws { font-size:12.5px; color:var(--muted); white-space:nowrap; }
.tools { margin-left:auto; display:flex; gap:2px; align-items:center; }
.tools input { border:1px solid var(--line); background:var(--pane); border-radius:6px; padding:5px 9px; width:180px; outline:none; }
.ib { width:34px; height:34px; display:grid; place-items:center; border:0; background:transparent; border-radius:6px; color:var(--muted); flex:none; }
.ib:hover { background:var(--sel); color:var(--text); }
.dots i { display:inline-block; width:3px; height:3px; border-radius:50%; background:currentColor; margin-left:2px; animation:blink 1.2s infinite; vertical-align:middle; }
.dots i:nth-child(2) { animation-delay:.2s; } .dots i:nth-child(3) { animation-delay:.4s; }
@keyframes blink { 0%,60%,100% { opacity:.25; } 30% { opacity:1; } }

.pinbar { display:flex; align-items:center; gap:10px; padding:6px 8px 6px 16px; border-bottom:1px solid var(--line); background:var(--win); font-size:13px; cursor:pointer; }
.pinbar .pq { flex:1; border-left:2px solid var(--accent); padding-left:8px; min-width:0; }
.pinbar .pq b { display:block; color:var(--accent); font-weight:600; font-size:12.5px; }
.pinbar .pq span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.hwrap { position:relative; min-height:0; }
.history { position:absolute; inset:0; overflow-y:auto; padding:8px 0 10px; }
.history.bg-dots { background-image:radial-gradient(color-mix(in srgb, var(--faint) 45%, transparent) 1px, transparent 1.4px); background-size:18px 18px; }
.history.bg-grid { background-image:linear-gradient(color-mix(in srgb, var(--line) 70%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--line) 70%, transparent) 1px, transparent 1px); background-size:28px 28px; }
.empty { height:100%; display:grid; place-items:center; color:var(--muted); }
.todown { position:absolute; right:16px; bottom:14px; width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--win); color:var(--muted); display:grid; place-items:center; box-shadow:var(--shadow); }
.todown .i { transform:rotate(90deg); }

.day { text-align:center; margin:10px 0 6px; position:sticky; top:4px; z-index:2; pointer-events:none; }
.day span, .svc span { display:inline-block; font-size:12px; padding:2px 10px; border-radius:10px; background:color-mix(in srgb, var(--win) 88%, transparent); border:1px solid var(--line); color:var(--muted); }
.svc { text-align:center; margin:8px 0; }
.unread-sep { margin:10px 0; padding:4px; text-align:center; font-size:12px; color:var(--muted); background:var(--pane); border-block:1px solid var(--line); }

.row { display:flex; padding:1px 16px; align-items:flex-end; }
.row.first { margin-top:7px; }
.row.out { justify-content:flex-end; }
.row.post { justify-content:center; }
.row.post.first { margin-top:12px; }
.row.dim { opacity:.25; }
.row.flash .bubble { animation:flash 1.4s; }
@keyframes flash { 0%,40% { box-shadow:0 0 0 3px var(--accent); } 100% { box-shadow:0 0 0 0 transparent; } }
.mava { width:34px; margin-right:8px; flex:none; }
.mcol { display:flex; flex-direction:column; max-width:min(540px, 76%); min-width:0; }
.row.post .mcol { width:min(560px, 92%); max-width:none; }
.bubble { background:var(--in); border-radius:10px; padding:6px 10px 6px; position:relative; font-size:var(--msg); box-shadow:0 1px 0 rgba(0,0,0,.06); overflow-wrap:anywhere; }
.row.out .bubble { background:var(--out); }
.row.in.first .bubble { border-top-left-radius:3px; }
.row.out.first .bubble { border-top-right-radius:3px; }
.row.post .bubble { border-radius:10px; }
.bubble.media { padding:3px; }
.bubble.media .mhead { padding:3px 7px 4px; }
.row .bubble.bare { background:none; box-shadow:none; padding:0; }
.bubble.pb { padding-bottom:20px; }
.from { font-size:13px; font-weight:600; color:var(--c); margin-bottom:1px; }
:root[data-theme="dark"] .from { color:color-mix(in srgb, var(--c) 55%, white); }
.fwd { font-size:13px; color:var(--accent); margin-bottom:2px; }
.quote { border-left:2px solid var(--accent); padding:2px 8px; margin:2px 0 5px; font-size:13px; background:var(--accent-soft); border-radius:0 4px 4px 0; min-width:0; }
.quote b { display:block; color:var(--accent); font-weight:600; }
.quote span { display:block; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:420px; }
.row.out .quote { background:color-mix(in srgb, var(--accent) 12%, transparent); }
.txt code { white-space:nowrap; font-family:var(--mono); font-size:.9em; background:color-mix(in srgb, var(--text) 8%, transparent); padding:0 4px; border-radius:3px; }
.meta { float:right; margin:7px 0 -5px 10px; font-size:11px; color:var(--faint); display:inline-flex; align-items:center; gap:3px; white-space:nowrap; font-variant-numeric:tabular-nums; user-select:none; }
.meta .i { width:13px; height:13px; }
.row.out .meta { color:color-mix(in srgb, var(--accent) 55%, var(--muted)); }
.meta.abs { position:absolute; right:10px; bottom:5px; float:none; margin:0; }
.meta.over { position:absolute; right:8px; bottom:8px; float:none; margin:0; background:rgba(0,0,0,.45); color:#fff !important; padding:1px 7px; border-radius:9px; }
.chk { width:16px; height:11px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.cap { padding:5px 7px 3px; }
.lp { border-left:2px solid var(--accent); background:var(--accent-soft); padding:5px 9px; border-radius:0 6px 6px 0; margin:6px 0 2px; font-size:13px; clear:both; }
.lp b { color:var(--accent); font-weight:600; }
.lp .lt { font-weight:600; }
.lp .ld { color:var(--muted); }
.reacts { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; clear:both; }
.cap .reacts { margin-top:4px; }
.rc { border:0; border-radius:12px; padding:2px 8px; background:var(--accent-soft); color:var(--accent); font-size:13px; display:inline-flex; gap:4px; align-items:center; }
.row.out .rc { background:color-mix(in srgb, var(--accent) 18%, transparent); }
.rc.me, .row.out .rc.me { background:var(--accent); color:var(--accent-ink); }
.rc b { font-weight:600; }
.comments { display:flex; align-items:center; gap:8px; border-top:1px solid var(--line); margin:8px -10px -6px; padding:8px 10px; color:var(--accent); font-weight:600; font-size:13px; }
.bubble.media .comments { margin:6px -3px -3px; }
.comments .i { margin-left:auto; }
.cavs { display:flex; }
.cavs i { width:22px; height:22px; border-radius:50%; border:2px solid var(--in); margin-left:-6px; color:#fff; font:600 10px/18px var(--sans); text-align:center; font-style:normal; }
.cavs i:first-child { margin-left:0; }

/* media */
.ph { width:340px; max-width:100%; display:block; border-radius:7px; overflow:hidden; cursor:zoom-in; background:var(--pane); }
.ph svg { width:100%; height:100%; display:block; }
.row.post .ph { width:100%; }
.album { display:grid; grid-template-columns:2fr 1fr; grid-template-rows:1fr 1fr; gap:2px; width:380px; height:270px; border-radius:7px; overflow:hidden; }
.album .ph { width:auto; height:100%; border-radius:0; }
.album .ph:first-child { grid-row:span 2; }
.stk { width:160px; height:160px; position:relative; }
.stk > svg { width:100%; height:100%; }

.voice { display:flex; align-items:center; gap:10px; min-width:270px; }
.vplay { width:42px; height:42px; border-radius:50%; background:var(--accent); color:var(--accent-ink); border:0; display:grid; place-items:center; flex:none; }
.vplay .ipa, .voice.playing .vplay .ipl { display:none; }
.voice.playing .vplay .ipa { display:block; }
.vbody { flex:1; min-width:0; }
.wave { display:flex; align-items:center; gap:2px; height:24px; cursor:pointer; }
.wave i { width:3px; border-radius:2px; height:calc(var(--h) * 100%); background:color-mix(in srgb, var(--accent) 35%, transparent); }
.wave i.on { background:var(--accent); }
.vinfo { font-size:12px; color:var(--muted); display:flex; gap:6px; align-items:center; margin-top:3px; font-variant-numeric:tabular-nums; }
.vdot { display:none; width:6px; height:6px; border-radius:50%; background:var(--accent); }
.voice.unheard .vdot { display:inline-block; }
.vspeed { border:0; background:var(--accent-soft); color:var(--accent); font-size:11px; font-weight:600; border-radius:8px; padding:0 6px; line-height:16px; }
.vtr { border:0; width:36px; white-space:nowrap; padding:0; height:30px; border-radius:8px; background:var(--accent-soft); color:var(--accent); font-size:12px; font-weight:700; flex:none; align-self:center; }
.vtext { font-size:13.5px; padding:7px 2px 0; }
.circle { width:220px; height:220px; position:relative; cursor:pointer; transition:width .25s, height .25s; }
.circle.playing { width:300px; height:300px; }
.circle:not(.playing) .cring { opacity:0; }
.cvid { position:absolute; inset:0; border-radius:50%; overflow:hidden; background:#222; }
.cvid svg { width:100%; height:100%; display:block; }
.circle.playing .cvid svg { animation:pan 7s ease-in-out infinite alternate; }
@keyframes pan { from { transform:scale(1.12) translate(-4%,1%); } to { transform:scale(1.25) translate(5%,-2%); } }
.cring { position:absolute; inset:-5px; width:calc(100% + 10px); height:calc(100% + 10px); transform:rotate(-90deg); pointer-events:none; }
.cring circle { fill:none; stroke:var(--accent); stroke-width:2.2; stroke-dasharray:100; stroke-dashoffset:100; stroke-linecap:round; }
.cplay { position:absolute; left:50%; top:50%; width:48px; height:48px; margin:-24px 0 0 -24px; border-radius:50%; background:rgba(0,0,0,.45); color:#fff; display:grid; place-items:center; }
.cplay .i { width:20px; height:20px; }
.circle.playing .cplay { display:none; }
.ctime { position:absolute; left:16px; bottom:16px; background:rgba(0,0,0,.45); color:#fff; font-size:11px; padding:1px 7px; border-radius:9px; font-variant-numeric:tabular-nums; }
.file { display:flex; gap:10px; align-items:center; min-width:250px; padding:2px 0; }
.fic { width:46px; height:46px; border-radius:10px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; position:relative; border:0; flex:none; }
.fext { font:700 10px var(--mono); letter-spacing:.03em; }
.file.loading .fic .i { visibility:hidden; }
.file.loading .fic::after { content:""; position:absolute; inset:9px; border:2px solid color-mix(in srgb, var(--accent-ink) 35%, transparent); border-top-color:var(--accent-ink); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.fname { font-weight:600; max-width:270px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fsize { font-size:12px; color:var(--muted); }
.poll { min-width:310px; }
.pq { font-weight:600; }
.pk { font-size:12px; color:var(--muted); margin-bottom:6px; }
.popt { display:grid; grid-template-columns:24px 1fr auto; align-items:center; width:100%; border:0; background:none; padding:7px 0 9px; text-align:left; position:relative; }
.popt:disabled { cursor:default; color:inherit; }
.pr { width:16px; height:16px; border-radius:50%; border:1.5px solid var(--faint); display:grid; place-items:center; }
.popt:not(:disabled):hover .pr { border-color:var(--accent); }
.poll.voted .pr { border:0; }
.popt.mine .pr { background:var(--accent); color:var(--accent-ink); }
.popt.mine .pr .i { width:12px; height:12px; stroke-width:2.2; }
.pp { display:none; font-size:13px; font-weight:600; }
.poll.voted .pp { display:block; }
.pbar { position:absolute; left:24px; bottom:2px; height:3px; border-radius:2px; width:0; background:var(--accent); transition:width .5s; }
.poll.voted .pbar { width:calc((100% - 24px) * var(--w) / 100); }
.ptot { text-align:center; font-size:12px; color:var(--muted); margin-top:4px; }
.kb { display:grid; gap:4px; margin-top:4px; }
.kbrow { display:flex; gap:4px; }
.kbb { flex:1; border:0; padding:8px; border-radius:7px; background:color-mix(in srgb, var(--accent) 16%, var(--in)); color:var(--text); font-weight:500; }
.kbb:hover { background:color-mix(in srgb, var(--accent) 26%, var(--in)); }

/* composer */
.replybar { display:flex; align-items:center; gap:10px; padding:6px 8px 0 16px; background:var(--win); border-top:1px solid var(--line); color:var(--accent); }
.replybar .quote { flex:1; margin:0; color:var(--text); }
.composer { display:flex; align-items:flex-end; gap:2px; padding:6px 8px; background:var(--win); border-top:1px solid var(--line); position:relative; }
.replybar:not([hidden]) + .composer { border-top:0; }
.composer textarea { flex:1; resize:none; border:0; outline:none; background:transparent; padding:7px 6px; height:34px; max-height:160px; line-height:20px; font-size:var(--msg); }
.sendb, .recb { width:36px; height:36px; border-radius:50%; border:0; display:grid; place-items:center; flex:none; }
.sendb { background:var(--accent); color:var(--accent-ink); }
.botmenu { width:auto; padding:0 10px; background:var(--accent); color:var(--accent-ink); font-size:13px; font-weight:600; height:30px; margin:2px 4px 2px 0; border-radius:15px; display:flex; gap:6px; align-items:center; }
.botmenu:hover { background:var(--accent); color:var(--accent-ink); filter:brightness(1.08); }
.botmenu .i { width:15px; height:15px; }
.recbar { display:none; flex:1; align-items:center; gap:12px; height:36px; padding:0 8px; }

recb.addEventListener("pointerdown", e => { e.preventDefault(); holdT = setTimeout(startRec, 230); });
document.addEventListener("pointerup", () => {
  if (holdT) { clearTimeout(holdT); holdT = null; state.recMode = state.recMode === "voice" ? "circle" : "voice"; syncComposer(); toast(state.recMode === "voice" ? "Режим: голосовое сообщение" : "Режим: видеосообщение"); return; }
  if (rec) finishRec(true);
});
function startRec() {
  holdT = null;
  rec = { start: performance.now(), mode: state.recMode, timer: setInterval(() => {
    const s = (performance.now() - rec.start) / 1000;
    $("#rtime").textContent = `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")},${Math.floor(s * 10) % 10}`;
    if (s >= 60) finishRec(true);
  }, 100) };
  composer.classList.add("recording");
  if (rec.mode === "circle") { camprev.innerHTML = scene(91, 300, 300); camprev.hidden = false; }
}
function finishRec(send) {
  if (!rec) return;
  clearInterval(rec.timer);
  const s = (performance.now() - rec.start) / 1000, mode = rec.mode;
  rec = null; composer.classList.remove("recording"); camprev.hidden = true; $("#rtime").textContent = "0:00,0";
  if (!send) { toast("Запись отменена"); return; }
  if (s < .8) { toast("Слишком коротко — удерживайте кнопку"); return; }
  const dur = Math.max(1, Math.round(s));
  sendMsg(mode === "voice" ? { kind: "voice", dur, seed: Math.floor(Math.random() * 1000) } : { kind: "circle", dur, seed: 91 });
}

function renderInfo() {
  app.classList.toggle("showinfo", state.info);
  if (!state.info) return;
  const c = cur();
  const title = { private: "Пользователь", group: "Группа", channel: "Канал", bot: "Бот", saved: "Избранное" }[c.type];
  let rows = "";
  const r = (icon, v, label) => v ? `<div class="irow">${ic(icon)}<span>${esc(v)}</span><small>${label}</small></div>` : "";
  if (c.type === "private") rows = r("phone", c.phone, "Телефон") + r("at", c.user && "@" + c.user, "Имя пользователя") + r("info", c.bio, "О себе");
  else if (c.type === "bot") rows = r("info", c.desc, "Описание") + r("at", "@" + c.user, "Имя пользователя");
  else if (c.type !== "saved") rows = r("info", c.desc, "Описание") + r("link", c.link, "Ссылка");
  const media = [], files = [], voices = [], links = [];
  c.msgs.forEach(m => {
    if (m.kind === "photo") media.push(m.seed); if (m.kind === "album") media.push(...m.seeds); if (m.kind === "chart") media.push("chart");
    if (m.kind === "file") files.push(m); if (m.kind === "voice" || m.kind === "circle") voices.push(m);
    if (m.lp) links.push(m);
  });
  const tabs = [["media", "Медиа", media.length], ["files", "Файлы", files.length], ["voice", "Голосовые", voices.length], ["links", "Ссылки", links.length]];
  const none = `<div class="inone">Здесь пока пусто</div>`;
  let tc = "";
  if (state.itab === "media") tc = media.length ? `<div class="igrid">${media.map(s => s === "chart" ? `<div class="ph" data-chart="1">${chartSVG()}</div>` : `<div class="ph" data-seed="${s}">${scene(s, 200, 200)}</div>`).join("")}</div>` : none;
  if (state.itab === "files") tc = files.length ? `<div class="ilist">${files.map(m => `<div class="file"><span class="fic"><span class="fext">${esc(m.file.ext)}</span></span><div><div class="fname">${esc(m.file.name)}</div><div class="fsize">${esc(m.file.size)} · ${m.t}</div></div></div>`).join("")}</div>` : none;
  if (state.itab === "voice") tc = voices.length ? `<div class="ilist">${voices.map(m => `<div class="il"><b>${m.kind === "voice" ? "Голосовое" : "Видеосообщение"} · ${fmtDur(m.dur)}</b><span>${esc(m.out ? "Вы" : m.from || c.title)}, ${m.t}</span></div>`).join("")}</div>` : none;
  if (state.itab === "links") tc = links.length ? `<div class="ilist">${links.map(m => `<div class="il"><b>${esc(m.lp.title)}</b><span>${esc(m.lp.site)}</span></div>`).join("")}</div>` : none;
  info.innerHTML = `<div><div class="ihead"><span>${title}</span><button class="ib" data-act="closeinfo" title="Закрыть">${ic("close")}</button></div>
  <div class="iscroll"><div class="iprof">${avaHTML(c, 92)}<div class="in">${esc(c.title)}</div><div class="is">${statusText(c)}</div></div>${rows}
  ${c.type !== "saved" ? `<label class="irow tgl">${ic("bell")}<span>Уведомления</span><input type="checkbox" data-ik="notif" ${c.muted ? "" : "checked"}><span class="sw"></span></label>` : ""}
  <div class="itabs">${tabs.map(t => `<button class="${state.itab === t[0] ? "on" : ""}" data-it="${t[0]}">${t[1]}${t[2] ? " " + t[2] : ""}</button>`).join("")}</div>${tc}</div></div>`;
}

/* ---------- viewer ---------- */
function openViewer(m, c, seed) {
  pause();
  const isChart = seed === "chart";
  const ar = isChart ? "340/226" : m && m.kind === "photo" ? `${m.w || 4}/${m.h || 3}` : "1/1";
  const [w, h] = isChart ? [340, 226] : ar.split("/").map(n => +n * 300);
  const from = m ? (m.out ? S.name : m.from || c.title) : c.title;
  viewer.innerHTML = `<div class="vtop">${avaName(from, 36)}<div class="vw"><b>${esc(from)}</b><span>${m ? (m.t || "") : ""}</span></div>
    <button class="ib" data-v="dl" title="Сохранить">${ic("download")}</button><button class="ib" data-v="close" title="Закрыть (Esc)">${ic("close")}</button></div>
    <div class="vstage"><div class="vimg" style="--ar:${ar}">${isChart ? chartSVG() : scene(seed, w, h)}</div></div><div class="vcap">${m && m.text ? fmt(m.text.split("\n")[0]) : ""}</div>`;
  viewer.hidden = false;
}

});

    sect("Свои прокси", S.proxies.map((p, i) => `<div class="srow static">${ic("net")}<span class="sl">${esc(p.host)}:${p.port}<small>${p.type}</small></span><button class="sbtn" data-act="delProxy" data-i="${i}">Удалить</button></div>`).join("") +
      `<div class="pxform"><label>Тип<select id="pxtype"><option>MTProxy</option><option>SOCKS5</option></select></label><label>Сервер<input id="pxhost" placeholder="host или IP"></label><label>Порт<input id="pxport" placeholder="443" inputmode="numeric"></label><label class="wide">Секрет / логин:пароль<input id="pxsec" placeholder="ee…"></label></div>
      <div class="pxbtns"><button class="sbtn" data-act="testProxy">Проверить</button><button class="sbtn pri" data-act="addProxy">Добавить</button></div>`); } },
  ghost: { t: "Призрачный режим", h: () =>
    sect("", tog("ghostRead", "Не отправлять «прочитано»", "Собеседник не увидит двух галочек") + tog("ghostOnline", "Не показываться в сети") + tog("ghostTyping", "Не отправлять «печатает…»"),
      "Работает только в tgx. Telegram может ограничить api_id клиентов с такими функциями: для личного использования это приемлемо, перед публичным релизом решение пересматривается.") },
  deleted: { t: "Удалённые и изменённые", h: () =>
    sect("", tog("keepDeleted", "Сохранять удалённые сообщения") + tog("keepEdits", "Сохранять историю правок"),
      "Сообщения пишутся в локальную базу SQLite на этом компьютере. Медиафайлы не сохраняются — только текст и метаданные.") +
    sect("Локальная база", row("trash", "Удалённых сообщений", String(S.deletedCount)) + row("history", "Правок", "112") + row("data", "Размер базы", "2,1 МБ")) },
  about: { t: "О программе", h: () =>
    `<div class="about"><div class="mark">tgx</div><div class="an">tgx</div><div class="av">0.1.0 · интерактивный макет</div><p class="snote">Клиент Telegram для Windows со встроенным WebSocket-транспортом.</p></div>` +
    sect("Компоненты", row("", "TDLib", "BSL-1.0") + row("", "Slint", "royalty-free") + row("", "tg-ws-proxy (Flowseal)", "MIT")) +
    sect("", "", "tgx использует собственный api_id и не является официальным приложением Telegram.") },
  contacts: { t: "Контакты", h: () =>
    sect("", CONTACTS.map(([n, s]) => `<button class="srow" data-act="openContact" data-n="${esc(n)}">${avaName(n, 40)}<span class="sl">${esc(n)}<small${s === "в сети" ? ' class="acc"' : ""}>${s}</small></span></button>`).join("")) },
  calls: { t: "Звонки", h: () =>
    sect("Недавние", CALLS.map(([n, d, w, l]) => `<div class="srow static callrow">${avaName(n, 40)}<span class="sl">${esc(n)}<small>${ic(d === "out" ? "arrOut" : "arrIn", d === "missed" ? "missed" : d === "in" ? "inc" : "")} ${w}</small></span><span class="sv" style="color:var(--muted)">${l}</span></div>`).join(""), "Сами звонки появятся в M6. Сейчас tgx показывает только историю.") },
  newgroup: { t: "Новая группа", h: () =>
    sect("Название", `<div class="sfield"><input id="ngname" maxlength="64" placeholder="Название группы"></div>`) +
    sect("Участники", CONTACTS.map(([n]) => `<label class="srow">${avaName(n, 36)}<span class="sl">${esc(n)}</span><input type="checkbox" class="ckb" value="${esc(n)}"></label>`).join("")) +
    `<div class="pxbtns" style="padding-top:12px"><button class="sbtn pri" data-act="createGroup">Создать</button></div>` },
  newchannel: { t: "Новый канал", h: () =>
    sect("Название", `<div class="sfield"><input id="ncname" maxlength="64" placeholder="Название канала"></div>`) +
    sect("Описание", `<div class="sfield"><textarea id="ncdesc" rows="2" maxlength="255" placeholder="Необязательно"></textarea></div>`, "Канал — для публикаций на широкую аудиторию. Писать в нём сможете только вы.") +
    `<div class="pxbtns" style="padding-top:12px"><button class="sbtn pri" data-act="createChannel">Создать</button></div>` }
};
let nav = [];
function openSettings(p = "main") { nav = p === "main" ? ["main"] : ["main", p]; mwrap.hidden = false; renderPage(); closeDrawer(); }
function go(p) { nav.push(p); renderPage(); }
function closeModal() { mwrap.hidden = true; }
function renderPage(keep) {
  const [name, arg] = nav[nav.length - 1].split(":"), def = PAGES[name], top = mbody.scrollTop;
  $("#mtitle").textContent = typeof def.t === "function" ? def.t(arg) : def.t;
  mbody.innerHTML = def.h(arg);
  mbody.scrollTop = keep ? top : 0;
  $("#mback").style.visibility = nav.length > 1 ? "visible" : "hidden";
}
$("#mback").innerHTML = ic("back"); $("#mclose").innerHTML = ic("close");
$("#mback").addEventListener("click", () => { if (nav.length > 1) { nav.pop(); renderPage(); } });
$("#mclose").addEventListener("click", closeModal);
mwrap.addEventListener("mousedown", e => { if (e.target === mwrap) closeModal(); });
mbody.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) { go(g.dataset.go); return; }
  const ac = e.target.closest("[data-acc]"); if (ac) { S.accent = ac.dataset.acc; applySettings(); renderPage(true); return; }
  const a = e.target.closest("[data-act]"); if (a && ACT[a.dataset.act]) ACT[a.dataset.act](a);
});
mbody.addEventListener("change", e => {
  const el = e.target, k = el.dataset.k; if (!k || el.type === "text" || el.tagName === "TEXTAREA") return;
  setK(k, el.type === "checkbox" ? el.checked : el.type === "range" ? +el.value : el.value);
  applySettings(); renderPage(true);
});
mbody.addEventListener("input", e => {
  const el = e.target, k = el.dataset.k; if (!k) return;
  if (el.type === "range") { S.font = +el.value; $("#fontv").textContent = S.font + " px"; applySettings(); return; }
  if (el.type === "text" || el.tagName === "TEXTAREA" || !el.type) {
    setK(k, el.value);
    if (k === "bio") $("#biocnt").textContent = 70 - el.value.length;
    renderDrawer();
  }
});
const ACT = {
  logout() { closeModal(); pause(); state.loggedIn = false; renderLogin("phone"); },
  photo() { toast("Выбор файла откроется системным диалогом Windows"); },
  clearCache() { const t = S.store.reduce((a, s) => a + s[1], 0); S.store.forEach(s => s[1] = 0); renderPage(true); toast(`Очищено ${(t / 1024).toFixed(1).replace(".", ",")} ГБ`); },
  endSession(a) { const s = S.sessions.splice(+a.dataset.i, 1)[0]; renderPage(true); toast(`Сеанс «${s[0]}» завершён`); },
  endAll() { S.sessions = []; renderPage(true); toast("Все другие сеансы завершены"); },
  addUnread() { S.unreadFolder = true; renderRail(); renderPage(true); toast("Папка «Непрочитанные» добавлена"); },
  delProxy(a) { S.proxies.splice(+a.dataset.i, 1); applySettings(); renderPage(true); },
  testProxy() {
    const h = $("#pxhost").value.trim(), p = +$("#pxport").value;
    if (!h || !(p > 0 && p < 65536)) { toast("Укажите сервер и порт 1–65535"); return; }
    toast(`Проверка ${h}:${p}… в макете сеть не используется`);
  },
  addProxy() {
    const h = $("#pxhost").value.trim(), p = +$("#pxport").value;
    if (!/^[\w.-]{1,253}$/.test(h) || !(p > 0 && p < 65536)) { toast("Проверьте сервер и порт"); return; }
    S.proxies.push({ type: $("#pxtype").value, host: h, port: p }); applySettings(); renderPage(true); toast("Прокси добавлен");
  },
  openContact(a) {
    const n = a.dataset.n; let c = CH.find(x => x.type === "private" && x.title === n);
    if (!c) { c = { id: "u" + Date.now(), type: "private", title: n, ini: initials(n), col: colOf(n), unread: 0, ts: Date.now(), last: "был(а) недавно", msgs: [] }; CH.push(c); }
    closeModal(); openChat(c.id);
  },
  createGroup() {
    const n = $("#ngname").value.trim(); if (!n) { toast("Введите название группы"); $("#ngname").focus(); return; }
    const mem = $$(".ckb:checked", mbody).map(x => x.value);
    const c = { id: "g" + Date.now(), type: "group", title: n, ini: initials(n), col: colOf(n), members: mem.length + 1, online: 1, unread: 0, ts: Date.now(), desc: "", msgs: [D(TODAY), { kind: "svc", text: `Вы создали группу «${n}»` }] };
    if (mem.length) c.msgs.push({ kind: "svc", text: `Вы добавили: ${mem.join(", ")}` });
    c.msgs.forEach(m => { if (!m.day) m.id = MID++; });
    CH.push(c); closeModal(); openChat(c.id);
  },
  createChannel() {
    const n = $("#ncname").value.trim(); if (!n) { toast("Введите название канала"); $("#ncname").focus(); return; }
    const c = { id: "c" + Date.now(), type: "channel", admin: true, title: n, ini: initials(n), col: colOf(n), subs: 1, unread: 0, ts: Date.now(), desc: $("#ncdesc").value.trim(), msgs: [D(TODAY), { kind: "svc", text: "Канал создан" }] };
    c.msgs[1].id = MID++;
    CH.push(c); closeModal(); openChat(c.id);
  }
};

/* ---------- status bar & connection ---------- */
let lastRoute = null;
function renderStatus() {
  const ar = activeRoute();
  if (lastRoute !== null && ar !== lastRoute && state.loggedIn) connect();
  lastRoute = ar;
  const hop = (name, r, enabled) => `<span class="hop ${ar === r ? "cur" : !enabled ? "dis" : ""}">${name}</span>`;
  let chain;
  if (S.route === "auto") chain = [hop("WS", "ws", S.rWS), hop("MTProxy", "proxy", S.rProxy && S.proxies.length), hop("direct", "direct", S.direct)].join('<span class="arr">→</span>');
  else chain = `<span class="hop ${ar === S.route ? "cur" : "dis"}">только ${{ ws: "WS", proxy: "MTProxy", direct: "direct" }[S.route]}</span>`;
  const px = S.proxies[0];
  const host = { ws: "kws2.web.telegram.org · DC2", proxy: px ? `${px.host}:${px.port} · DC2` : "", direct: "149.154.167.51 · DC2", none: "" }[ar];
  const ping = { ws: "48 ms · ↓ 1.2 MB/s", proxy: "112 ms · ↓ 0.8 MB/s", direct: "61 ms", none: "" }[ar];
  const [dot, label] = ar === "none" ? ["bad", "нет маршрута"] : state.conn === "ready" ? ["ok", "готово"] : ["warn", "подключение…"];
  const ghost = S.ghostRead || S.ghostOnline || S.ghostTyping;
  statusEl.innerHTML = `<span><span class="dot ${dot}"></span><b>${label}</b></span><span class="chain">${chain}</span><span>${host}</span>${ar === "direct" ? '<span class="tag warn">видно провайдеру</span>' : ""}${ghost ? '<span class="tag">призрак</span>' : ""}<span class="r">${state.conn === "ready" ? ping : ""}</span>`;
  const lr = $("#lroute", login);
  if (lr) lr.innerHTML = state.conn === "ready" ? `<span class="dot ${dot}"></span>соединение: ${routeName(ar)} · DC2 · ${ping.split(" ·")[0]}` : `<span class="dot warn"></span>подключение: ${routeName(ar)} → DC2 · рукопожатие…`;
}
let connT = null;
function connect() {
  state.conn = "connecting"; clearTimeout(connT);
  connT = setTimeout(() => { state.conn = "ready"; renderStatus(); if (!mwrap.hidden && nav[nav.length - 1] === "connection") renderPage(true); }, 900);
}
statusEl.addEventListener("click", () => { if (state.loggedIn) openSettings("connection"); });

/* ---------- theme & settings application ---------- */
const mq = matchMedia("(prefers-color-scheme: dark)");
function applySettings() {
  const dark = S.theme === "dark" || (S.theme === "system" && mq.matches);
  root.dataset.theme = dark ? "dark" : "light";
  root.style.setProperty("--accent", ACC[S.accent][dark ? 1 : 0]);
  root.style.setProperty("--msg", S.font + "px");
  root.classList.toggle("no-anim", !S.anims);
  hist.className = "history bg-" + S.bg;
  renderStatus();
  const n = $("#nightT"); if (n) n.checked = dark;
  renderRail();
}
mq.addEventListener("change", applySettings);

/* ---------- notifications ---------- */
let wtT = null;
function notify(c, m) {
  if (c.muted || !S.toasts) return;
  if ((c.type === "private" && !S.nPrivate) || (c.type === "group" && !S.nGroups) || (c.type === "channel" && !S.nChannels)) return;
  const wt = $("#wtoast");
  wt.innerHTML = `<div class="wa"><span>tgx</span><span>сейчас</span></div>${avaHTML(c, 40)}<b>${esc(c.title)}</b><span>${S.preview ? esc(plainOf(m)) : "Новое сообщение"}</span>`;
  wt.dataset.id = c.id; wt.hidden = false;
  clearTimeout(wtT); wtT = setTimeout(() => wt.hidden = true, 6000);
}
$("#wtoast").addEventListener("click", e => { const wt = e.currentTarget; wt.hidden = true; openChat(wt.dataset.id); });

let toastT = null;
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2200); }

/* ---------- login ---------- */
let phone = "+7 916 •••-••-12";
function renderLogin(step) {
  login.hidden = false;
  const steps = ["phone", "code", "pass"], si = steps.indexOf(step);
  const bar = si >= 0 ? `<div class="steps">${["Телефон", "Код", "Пароль"].map((s, i) => `<span class="${i < si ? "done" : ""} ${i === si ? "on" : ""}">${s}</span>`).join("")}</div>` : "";
  let b = "";
  if (step === "phone") b = `${bar}<h2>Вход</h2><p>Номер телефона, к которому привязан аккаунт Telegram.</p>
    <div class="phone"><label class="field">Код страны<input class="mono" id="lcc" value="+7"></label><label class="field">Номер<input class="mono" id="lph" placeholder="916 000-00-00" inputmode="tel"></label></div>
    <div class="lerr" id="lerr"></div><button class="btn primary" data-l="phoneNext">Получить код</button><div class="alt"><a href="#" data-l="qr">Войти по QR-коду</a></div>`;
  if (step === "code") b = `${bar}<h2>Код подтверждения</h2><p>Отправили код в Telegram на другом устройстве с номером <b>${esc(phone)}</b>.</p>
    <div class="code">${'<input maxlength="1" inputmode="numeric">'.repeat(5)}</div><div class="lerr" id="lerr"></div>
    <div class="alt"><a href="#" data-l="phone">Изменить номер</a> · код по SMS через 0:59</div>`;
  if (step === "pass") b = `${bar}<h2>Облачный пароль</h2><p>На аккаунте включена двухэтапная проверка.</p>
    <label class="field">Пароль<input type="password" id="lpw" autocomplete="current-password"></label><div class="lerr" id="lerr"></div>
    <button class="btn primary" data-l="passNext">Войти</button><div class="alt">Подсказка: кот · <a href="#" data-l="forgot">Забыли пароль?</a></div>`;
  if (step === "qr") b = `<h2>Вход по QR-коду</h2><div class="qrbox">${qrSVG()}</div>
    <ol class="qrsteps"><li>Откройте Telegram на телефоне</li><li>Настройки → Устройства → Подключить устройство</li><li>Наведите камеру на этот код</li></ol>
    <button class="btn" data-l="phone">Войти по номеру телефона</button>`;
  login.innerHTML = `<div class="lcard"><div class="mark">tgx</div>${b}<div class="lroute" id="lroute"></div></div>`;
  renderStatus();
  const f = $("input:not(#lcc)", login); f && f.focus();
  if (step === "code") {
    const ins = $$(".code input", login);
    ins.forEach((inp, i) => {
      inp.addEventListener("input", () => {
        inp.value = inp.value.replace(/\D/g, "");
        if (inp.value && ins[i + 1]) ins[i + 1].focus();
        if (ins.every(x => x.value)) setTimeout(() => renderLogin("pass"), 300);
      });
      inp.addEventListener("keydown", e => { if (e.key === "Backspace" && !inp.value && ins[i - 1]) ins[i - 1].focus(); });
    });
  }
}
login.addEventListener("click", e => {
  const a = e.target.closest("[data-l]"); if (!a) return;
  e.preventDefault();
  const l = a.dataset.l;
  if (l === "phoneNext") {
    const d = ($("#lph").value || "").replace(/\D/g, "");
    if (d.length < 10) { $("#lerr").textContent = "Проверьте номер: нужно 10 цифр"; $(".phone", login).classList.remove("shake"); void login.offsetWidth; $(".phone", login).classList.add("shake"); return; }
    phone = `${$("#lcc").value} ${d.slice(0, 3)} ${d.slice(3, 6)}-${d.slice(6, 8)}-${d.slice(8, 10)}`;
    renderLogin("code");
  } else if (l === "passNext") {
    if (!$("#lpw").value) { $("#lerr").textContent = "Введите пароль"; return; }
    state.loggedIn = true; login.hidden = true; connect(); renderStatus(); renderAll();
  } else if (l === "forgot") toast("Код сброса придёт на почту, привязанную к аккаунту");
  else renderLogin(l);
});
login.addEventListener("keydown", e => { if (e.key === "Enter") { const p = $(".btn.primary", login); p && p.click(); } });

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (rec) { finishRec(false); return; }
  if (!ctx.hidden) { ctx.hidden = true; return; }
  if (!viewer.hidden) { viewer.hidden = true; return; }
  if (!mwrap.hidden) { if (nav.length > 1) { nav.pop(); renderPage(); } else closeModal(); return; }
  if (drawer.classList.contains("open")) { closeDrawer(); return; }
  if ($$(".pop").some(p => !p.hidden)) { $$(".pop").forEach(p => p.hidden = true); return; }
  if (state.reply) { state.reply = null; renderReplyBar(); return; }
  if (state.info) { state.info = false; renderInfo(); }
});

/* ---------- page controls ---------- */
$("#toLogin").addEventListener("click", () => { closeModal(); closeDrawer(); viewer.hidden = true; state.loggedIn = false; pause(); renderLogin("phone"); });
$("#reset").addEventListener("click", () => { location.hash = ""; location.reload(); });

/* ---------- live events ---------- */
function scheduleLife() {
  setTimeout(() => { const c = chatOf("sveta"); if (!c) return; c.typing = false; push(c, T(null, "и ещё пункт 6.1 — там про залог", null)); }, 7000);
  setTimeout(() => { const c = chatOf("anton"); if (!c) return; push(c, T(null, "кстати, глянь потом spike-report, там график по медиа через WS", null)); }, 22000);
}

/* ---------- init ---------- */
(function init() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.has("dark")) S.theme = "dark";
  if (h.has("light")) S.theme = "light";
  if (h.get("chat") && chatOf(h.get("chat"))) state.chat = h.get("chat");
  if (h.has("info")) state.info = true;
  applySettings();
  syncComposer();
  openChat(state.chat);
  connect();
  if (h.has("login")) { state.loggedIn = false; renderLogin(h.get("login") || "phone"); }
  if (h.get("settings")) openSettings(h.get("settings"));
  if (h.has("drawer")) openDrawer();
  scheduleLife();
})();
</script>
</body>
</html>
