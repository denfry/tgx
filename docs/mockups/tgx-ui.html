<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tgx — прототип и дизайн-система</title>
<style>
/* Theme tokens. These two blocks are the built-in "Дневная" and "Ночная" presets;
   every token can be overridden per user from Settings → Оформление (applied as
   inline custom properties on <html>), and the whole set exports as a theme file. */
:root, [data-theme="light"] {
  --bg:#dde2e7; --win:#ffffff; --pane:#ffffff; --rail:#eef1f4; --chat:#cfdcc4;
  --line:#e4e7ea; --text:#121417; --muted:#6c7277; --faint:#9aa1a7; --sel:#f1f3f5;
  --sel-on:var(--accent); --sel-on-ink:#ffffff;
  --in:#ffffff; --out:#e2f6d1; --out-meta:#3f9a45; --in-meta:#8b9298;
  --accent:#3a8ee6; --accent-ink:#ffffff;
  --ok:#2e8a4f; --warn:#9a6410; --bad:#d0443a;
  --accent-soft:color-mix(in srgb, var(--accent) 12%, var(--win));
  --wall:linear-gradient(140deg, #d4e5bf 0%, #b6d4bf 38%, #bcd5df 72%, #d8e2bb 100%);
  --pattern:#2f5d2a; --pattern-o:.065;
  --chip-bg:rgba(48, 74, 60, .38); --chip-ink:#ffffff;
  --r-bubble:14px; --r-ava:50%; --tail:1;
  --shadow:0 8px 28px -8px rgba(0,0,0,.25);
  --bshadow:0 1px 1.5px rgba(16, 35, 47, .14);
  --msg:14px;
  --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
}
[data-theme="dark"] {
  --bg:#080c10; --win:#17212b; --pane:#17212b; --rail:#111a22; --chat:#0e1621;
  --line:#0d141b; --text:#f2f4f6; --muted:#7d8e9e; --faint:#5f6f7e; --sel:#202c38;
  --sel-on:#2b5278; --sel-on-ink:#ffffff;
  --in:#182533; --out:#2b5278; --out-meta:#86b5e0; --in-meta:#6d7f8f;
  --accent:#5aa9ec; --accent-ink:#ffffff;
  --ok:#5cc98a; --warn:#e5aa4e; --bad:#ec6f62;
  --accent-soft:color-mix(in srgb, var(--accent) 16%, var(--win));
  --wall:linear-gradient(160deg, #0f1b27 0%, #0c1620 55%, #111e2b 100%);
  --pattern:#8fb4d8; --pattern-o:.045;
  --chip-bg:rgba(20, 32, 44, .72); --chip-ink:#dfe7ee;
  --shadow:0 10px 32px -8px rgba(0,0,0,.6);
  --bshadow:0 1px 1.5px rgba(0, 0, 0, .35);
  color-scheme:dark;
}
:root {
  --pattern-tile:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260' viewBox='0 0 260 260'><g fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='30' cy='28' r='9'/><path d='M70 20l4 8 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z'/><path d='M120 18h28a6 6 0 016 6v14a6 6 0 01-6 6h-16l-8 7v-7h-4a6 6 0 01-6-6V24a6 6 0 016-6z'/><path d='M190 22c6-8 14-8 20 0s14 8 20 0'/><path d='M28 80v-6a8 8 0 0116 0v6M24 80h24v16H24z'/><path d='M92 70l-8 16h10l-6 16 16-20H94l6-12z'/><path d='M150 76l12 7v14l-12 7-12-7V83z'/><path d='M205 80h18M214 71v18'/><path d='M22 140a16 16 0 0132 0M28 140a10 10 0 0120 0M34 140a4 4 0 018 0'/><circle cx='100' cy='138' r='4'/><circle cx='118' cy='130' r='4'/><circle cx='118' cy='148' r='4'/><path d='M104 136l10-4M104 140l10 6'/><rect x='150' y='126' width='26' height='20' rx='4'/><path d='M150 132l13 8 13-8'/><path d='M214 124l12 12-12 12-12-12z'/><path d='M26 196c0-8 6-12 12-12s12 4 12 12-6 14-12 18c-6-4-12-10-12-18z'/><path d='M84 186h30M84 196h20M84 206h26'/><circle cx='160' cy='196' r='12'/><path d='M160 188v8l5 4'/><path d='M206 210l10-26 10 26M210 200h12'/><path d='M40 240l8-8 8 8 8-8 8 8'/><circle cx='132' cy='238' r='3'/><circle cx='146' cy='238' r='3'/><circle cx='160' cy='238' r='3'/><path d='M200 232h22v14h-22zM206 232v-4h10v4'/></g></svg>");
  --tail-l:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='9' height='17' viewBox='0 0 9 17'><path d='M9 0v17H0c3.2-1.4 5.5-3.6 7-6.6C8.4 7.5 9 4 9 0z'/></svg>");
  --tail-r:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='9' height='17' viewBox='0 0 9 17'><path d='M0 0v17h9c-3.2-1.4-5.5-3.6-7-6.6C.6 7.5 0 4 0 0z'/></svg>");
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html,body { margin:0; height:100%; }
body { background:var(--bg); color:var(--text); font:14px/1.4 var(--sans); display:flex; flex-direction:column; padding:10px 16px 16px; }
button,input,textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
a { color:var(--accent); }
.i { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.no-anim *, .no-anim *::before, .no-anim *::after { transition:none !important; animation:none !important; }

/* page chrome */
.page-head { max-width:1400px; width:100%; margin:0 auto 10px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
.page-head h1 { font-size:15px; margin:0; font-weight:600; }
.page-head p { margin:0; color:var(--muted); font-size:13px; flex:1; min-width:240px; }
.pbtn { border:1px solid var(--line); background:var(--win); padding:4px 12px; border-radius:4px; font-size:13px; }
.pbtn:hover { border-color:var(--faint); }
.scroller { flex:1; min-height:0; overflow:auto; }

/* window */
.window { min-width:1060px; max-width:1400px; height:100%; min-height:620px; margin:0 auto; background:var(--win);
  border:1px solid var(--line); display:grid; grid-template-rows:32px 1fr 26px; box-shadow:0 12px 32px -14px rgba(0,0,0,.25); overflow:hidden; }
.titlebar { display:flex; align-items:center; border-bottom:1px solid var(--line); padding-left:12px; font-size:12px; color:var(--muted); user-select:none; }
.titlebar b { color:var(--text); font-weight:600; margin-right:8px; }
.caps { margin-left:auto; display:flex; height:100%; }
.caps span { width:46px; display:grid; place-items:center; }
.caps span:hover { background:var(--sel); }
.caps span:last-child:hover { background:#c42b1c; color:#fff; }
.stage { position:relative; min-height:0; display:grid; }
.app { display:grid; grid-template-columns:68px 310px minmax(0,1fr) auto; min-height:0; }

/* rail */
.rail { background:var(--rail); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:4px 0 6px; overflow-y:auto; }
.rbtn { border:0; background:none; color:var(--muted); display:grid; justify-items:center; gap:3px; padding:9px 0 8px; font-size:11px; position:relative; }
.rbtn .i { width:22px; height:22px; }
.rbtn:hover { color:var(--text); }
.rbtn.on { color:var(--accent); font-weight:600; }
.rbtn.on::before { content:""; position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:0 3px 3px 0; background:var(--accent); }
.rbtn.menu { padding:12px 0; }
.rbtn.bottom { margin-top:auto; }
.rbadge { position:absolute; top:4px; left:calc(50% + 6px); min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--accent); color:var(--accent-ink); font-size:11px; font-weight:600; display:grid; place-items:center; }

/* chat list */
.list { background:var(--pane); border-right:1px solid var(--line); display:grid; grid-template-rows:auto 1fr; min-height:0; }
.lhead { padding:10px; }
.lhead input { width:100%; border:1px solid transparent; background:var(--sel); padding:8px 14px; border-radius:18px; outline:none; }
.lhead input:focus { border-color:var(--accent); background:var(--win); }
.chats { overflow-y:auto; }
.lsec { padding:8px 12px 4px; font-size:12px; color:var(--muted); font-weight:600; }
.lempty { padding:30px 16px; color:var(--muted); text-align:center; }
.citem { display:grid; grid-template-columns:50px minmax(0,1fr) auto; column-gap:11px; padding:8px 10px 8px 11px; align-items:center; cursor:default; }
.citem:hover { background:var(--sel); }
.citem.on { background:var(--sel-on); color:var(--sel-on-ink); }
.cmid { min-width:0; }
.t1 { display:flex; align-items:center; gap:4px; font-weight:600; min-width:0; }
.t1 .tt { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.t1 .i { width:14px; height:14px; color:var(--faint); }
.t2 { font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
.t2 .pfx { color:var(--text); }
.t2 em { font-style:normal; color:var(--accent); }
.t2 .draft { color:var(--bad); }
.citem.on .t1 .i, .citem.on .t2, .citem.on .t2 .pfx, .citem.on .t2 em, .citem.on .t2 .draft, .citem.on .ctm, .citem.on .acc { color:inherit; }
.citem.on .t2 { opacity:.85; }
.cr { display:grid; justify-items:end; gap:4px; align-self:stretch; padding:3px 0; }
.ctm { font-size:12px; color:var(--muted); display:flex; gap:2px; align-items:center; white-space:nowrap; }
.ctm .chk { color:var(--accent); }
.citem.on .ctm .chk { color:inherit; }
.badge { min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--accent); color:var(--accent-ink); font-size:12px; font-weight:600; display:grid; place-items:center; }
.badge.mut { background:var(--muted); color:var(--win); }
.citem.on .badge { background:var(--sel-on-ink); color:var(--sel-on); }
.cr .pinI { width:14px; height:14px; color:var(--faint); }
.citem.on .cr .pinI { color:inherit; }
.acc { color:var(--accent); }
.hit { background:color-mix(in srgb, var(--warn) 35%, transparent); border-radius:2px; }

/* avatars */
.ava { width:var(--s); height:var(--s); border-radius:var(--r-ava); display:grid; place-items:center; color:#fff; font-weight:600; font-size:calc(var(--s) * .34); flex:none; position:relative; user-select:none; }
.ava.sv { background:var(--accent); color:var(--accent-ink); }
.ava.sv .i { width:48%; height:48%; }
.ava.on::after { content:""; position:absolute; right:0; bottom:0; width:12px; height:12px; border-radius:50%; background:var(--ok); border:2px solid var(--pane); }

/* conversation */
.conv { display:grid; grid-template-rows:54px auto minmax(0,1fr) auto auto auto; min-height:0; min-width:0; background:var(--chat); }
.chead { display:flex; align-items:center; gap:12px; padding:0 8px 0 16px; border-bottom:1px solid var(--line); background:var(--win); min-width:0; }
.who { cursor:pointer; line-height:1.25; min-width:0; }
.who .wt { font-weight:600; display:flex; gap:5px; align-items:center; }
.who .wt .i { width:14px; height:14px; color:var(--faint); }
.who .ws { font-size:13px; color:var(--muted); white-space:nowrap; }
.tools { margin-left:auto; display:flex; gap:2px; align-items:center; }
.tools input { border:1px solid var(--line); background:var(--pane); border-radius:6px; padding:5px 9px; width:180px; outline:none; }
.ib { width:34px; height:34px; display:grid; place-items:center; border:0; background:transparent; border-radius:6px; color:var(--muted); flex:none; }
.ib:hover { background:var(--sel); color:var(--text); }
.dots i { display:inline-block; width:3px; height:3px; border-radius:50%; background:currentColor; margin-left:2px; animation:blink 1.2s infinite; vertical-align:middle; }
.dots i:nth-child(2) { animation-delay:.2s; } .dots i:nth-child(3) { animation-delay:.4s; }
@keyframes blink { 0%,60%,100% { opacity:.25; } 30% { opacity:1; } }

.pinbar { display:flex; align-items:center; gap:10px; padding:6px 8px 6px 16px; border-bottom:1px solid var(--line); background:var(--win); font-size:13px; cursor:pointer; }
.pinbar .pq { flex:1; border-left:2px solid var(--accent); padding-left:8px; min-width:0; }
.pinbar .pq b { display:block; color:var(--accent); font-weight:600; font-size:13px; }
.pinbar .pq span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.hwrap { position:relative; min-height:0; background:var(--wall); background-color:var(--chat); overflow:hidden; }
/* Doodle pattern over the wallpaper: one tile, coloured by --pattern through a mask so themes can recolour it. */
.hwrap::before { content:""; position:absolute; inset:0; background:var(--pattern); opacity:var(--pattern-o); pointer-events:none;
  -webkit-mask:var(--pattern-tile) repeat 0 0 / 260px 260px; mask:var(--pattern-tile) repeat 0 0 / 260px 260px; }
.hwrap.nopat::before { display:none; }
.hwrap.wimg { background:var(--wall-img) center / cover no-repeat; }
.history { position:absolute; inset:0; overflow-y:auto; padding:8px 0 10px; z-index:1; }
.history.bg-dots { background-image:radial-gradient(color-mix(in srgb, var(--faint) 45%, transparent) 1px, transparent 1.4px); background-size:18px 18px; }
.history.bg-grid { background-image:linear-gradient(color-mix(in srgb, var(--line) 70%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--line) 70%, transparent) 1px, transparent 1px); background-size:28px 28px; }
.empty { height:100%; display:grid; place-items:center; color:var(--muted); }
.todown { position:absolute; right:16px; bottom:14px; width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--win); color:var(--muted); display:grid; place-items:center; box-shadow:var(--shadow); }
.todown .i { transform:rotate(90deg); }

.day { text-align:center; margin:10px 0 6px; position:sticky; top:4px; z-index:2; pointer-events:none; }
.day span, .svc span { display:inline-block; font-size:13px; font-weight:500; padding:2px 10px 3px; border-radius:12px; background:var(--chip-bg); color:var(--chip-ink); }
/* Sticky date chips stack while scrolling; an opaque underlay keeps the older ones from showing through. */
.day span { background:linear-gradient(var(--chip-bg), var(--chip-bg)), var(--chat); }
.svc { text-align:center; margin:8px 0; }
.unread-sep { margin:10px 0; padding:4px; text-align:center; font-size:13px; color:var(--muted); background:color-mix(in srgb, var(--win) 85%, transparent); }

.row { display:flex; padding:1px 18px; align-items:flex-end; }
.row.first { margin-top:8px; }
.row.out { justify-content:flex-end; }
.row.post { justify-content:center; }
.row.post.first { margin-top:12px; }
.row.dim { opacity:.25; }
.row.flash .bubble { animation:flash 1.4s; }
@keyframes flash { 0%,40% { box-shadow:0 0 0 3px var(--accent); } 100% { box-shadow:0 0 0 0 transparent; } }
.mava { width:34px; margin-right:8px; flex:none; }
.mcol { display:flex; flex-direction:column; max-width:min(540px, 76%); min-width:0; }
.row.post .mcol { width:min(560px, 92%); max-width:none; }
.bubble { --bb:var(--in); background:var(--bb); border-radius:var(--r-bubble); padding:6px 11px 7px; position:relative; font-size:var(--msg); line-height:1.38; box-shadow:var(--bshadow); overflow-wrap:anywhere; }
.row.out .bubble { --bb:var(--out); }
/* A series is one block: inner corners shrink, the last bubble gets a tail. */
.row.in:not(.first) .bubble { border-top-left-radius:calc(var(--r-bubble) / 3); }
.row.in:not(.last) .bubble { border-bottom-left-radius:calc(var(--r-bubble) / 3); }
.row.out:not(.first) .bubble { border-top-right-radius:calc(var(--r-bubble) / 3); }
.row.out:not(.last) .bubble { border-bottom-right-radius:calc(var(--r-bubble) / 3); }
.tails .row.last:not(.post) .bubble:not(.bare)::after { content:""; position:absolute; bottom:0; width:9px; height:17px; background:var(--bb);
  -webkit-mask:var(--tail-shape) no-repeat 0 0 / 100% 100%; mask:var(--tail-shape) no-repeat 0 0 / 100% 100%; }
.tails .row.in.last:not(.post) .bubble:not(.bare) { border-bottom-left-radius:0; }
.tails .row.out.last:not(.post) .bubble:not(.bare) { border-bottom-right-radius:0; }
.tails .row.in.last .bubble::after { left:-8px; --tail-shape:var(--tail-l); }
.tails .row.out.last .bubble::after { right:-8px; --tail-shape:var(--tail-r); }
.row.post .bubble { border-radius:var(--r-bubble); }
.bubble.media { padding:3px; }
.bubble.media .mhead { padding:3px 7px 4px; }
.row .bubble.bare { background:none; box-shadow:none; padding:0; }
.bubble.pb { padding-bottom:20px; }
.from { font-size:13px; font-weight:600; color:var(--c); margin-bottom:1px; }
[data-theme="dark"] .from { color:color-mix(in srgb, var(--c) 55%, white); }
.fwd { font-size:13px; color:var(--accent); margin-bottom:2px; }
.quote { border-left:2px solid var(--accent); padding:2px 8px; margin:2px 0 5px; font-size:13px; background:var(--accent-soft); border-radius:0 4px 4px 0; min-width:0; }
.quote b { display:block; color:var(--accent); font-weight:600; }
.quote span { display:block; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:420px; }
.row.out .quote { border-color:var(--out-meta); background:color-mix(in srgb, var(--out-meta) 13%, transparent); }
.row.out .quote b, .row.out .fwd { color:var(--out-meta); }
.txt code { white-space:nowrap; font-family:var(--mono); font-size:.9em; background:color-mix(in srgb, var(--text) 8%, transparent); padding:0 4px; border-radius:3px; }
.meta { float:right; margin:7px 0 -5px 10px; font-size:12px; color:var(--in-meta); display:inline-flex; align-items:center; gap:3px; white-space:nowrap; font-variant-numeric:tabular-nums; user-select:none; }
.meta .i { width:13px; height:13px; }
.row.out .meta, .row.out .meta .chk { color:var(--out-meta); }
.meta.abs { position:absolute; right:10px; bottom:5px; float:none; margin:0; }
.meta.over { position:absolute; right:8px; bottom:8px; float:none; margin:0; background:rgba(0,0,0,.45); color:#fff !important; padding:1px 7px; border-radius:9px; }
.chk { width:16px; height:11px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.cap { padding:5px 7px 3px; }
.lp { border-left:2px solid var(--accent); background:var(--accent-soft); padding:5px 9px; border-radius:0 6px 6px 0; margin:6px 0 2px; font-size:13px; clear:both; }
.lp b { color:var(--accent); font-weight:600; }
.lp .lt { font-weight:600; }
.lp .ld { color:var(--muted); }
.reacts { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; clear:both; }
.cap .reacts { margin-top:4px; }
.rc { border:0; border-radius:12px; padding:2px 8px; background:var(--accent-soft); color:var(--accent); font-size:13px; display:inline-flex; gap:4px; align-items:center; }
.row.out .rc { background:color-mix(in srgb, var(--accent) 18%, transparent); }
.rc.me, .row.out .rc.me { background:var(--accent); color:var(--accent-ink); }
.rc b { font-weight:600; }
.comments { display:flex; align-items:center; gap:8px; border-top:1px solid var(--line); margin:8px -10px -6px; padding:8px 10px; color:var(--accent); font-weight:600; font-size:13px; }
.bubble.media .comments { margin:6px -3px -3px; }
.comments .i { margin-left:auto; }
.cavs { display:flex; }
.cavs i { width:22px; height:22px; border-radius:50%; border:2px solid var(--in); margin-left:-6px; color:#fff; font:600 10px/18px var(--sans); text-align:center; font-style:normal; }
.cavs i:first-child { margin-left:0; }

/* media */
.ph { width:340px; max-width:100%; display:block; border-radius:7px; overflow:hidden; cursor:zoom-in; background:var(--pane); }
.ph svg { width:100%; height:100%; display:block; }
.row.post .ph { width:100%; }
.album { display:grid; grid-template-columns:2fr 1fr; grid-template-rows:1fr 1fr; gap:2px; width:380px; height:270px; border-radius:7px; overflow:hidden; }
.album .ph { width:auto; height:100%; border-radius:0; }
.album .ph:first-child { grid-row:span 2; }
.stk { width:160px; height:160px; position:relative; }
.stk > svg { width:100%; height:100%; }

.voice { display:flex; align-items:center; gap:10px; min-width:270px; }
.vplay { width:42px; height:42px; border-radius:50%; background:var(--accent); color:var(--accent-ink); border:0; display:grid; place-items:center; flex:none; }
.vplay .ipa, .voice.playing .vplay .ipl { display:none; }
.voice.playing .vplay .ipa { display:block; }
.vbody { flex:1; min-width:0; }
.wave { display:flex; align-items:center; gap:2px; height:24px; cursor:pointer; }
.wave i { width:3px; border-radius:2px; height:calc(var(--h) * 100%); background:color-mix(in srgb, var(--accent) 35%, transparent); }
.wave i.on { background:var(--accent); }
.vinfo { font-size:12px; color:var(--muted); display:flex; gap:6px; align-items:center; margin-top:3px; font-variant-numeric:tabular-nums; }
.vdot { display:none; width:6px; height:6px; border-radius:50%; background:var(--accent); }
.voice.unheard .vdot { display:inline-block; }
.vspeed { border:0; background:var(--accent-soft); color:var(--accent); font-size:11px; font-weight:600; border-radius:8px; padding:0 6px; line-height:16px; }
.vtr { border:0; width:36px; white-space:nowrap; padding:0; height:30px; border-radius:8px; background:var(--accent-soft); color:var(--accent); font-size:12px; font-weight:700; flex:none; align-self:center; }
.vtext { font-size:13px; padding:7px 2px 0; }
.circle { width:220px; height:220px; position:relative; cursor:pointer; transition:width .25s, height .25s; }
.circle.playing { width:300px; height:300px; }
.circle:not(.playing) .cring { opacity:0; }
.cvid { position:absolute; inset:0; border-radius:50%; overflow:hidden; background:#222; }
.cvid svg { width:100%; height:100%; display:block; }
.circle.playing .cvid svg { animation:pan 7s ease-in-out infinite alternate; }
@keyframes pan { from { transform:scale(1.12) translate(-4%,1%); } to { transform:scale(1.25) translate(5%,-2%); } }
.cring { position:absolute; inset:-5px; width:calc(100% + 10px); height:calc(100% + 10px); transform:rotate(-90deg); pointer-events:none; }
.cring circle { fill:none; stroke:var(--accent); stroke-width:2.2; stroke-dasharray:100; stroke-dashoffset:100; stroke-linecap:round; }
.cplay { position:absolute; left:50%; top:50%; width:48px; height:48px; margin:-24px 0 0 -24px; border-radius:50%; background:rgba(0,0,0,.45); color:#fff; display:grid; place-items:center; }
.cplay .i { width:20px; height:20px; }
.circle.playing .cplay { display:none; }
.ctime { position:absolute; left:16px; bottom:16px; background:rgba(0,0,0,.45); color:#fff; font-size:11px; padding:1px 7px; border-radius:9px; font-variant-numeric:tabular-nums; }
.file { display:flex; gap:10px; align-items:center; min-width:250px; padding:2px 0; }
.fic { width:46px; height:46px; border-radius:10px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; position:relative; border:0; flex:none; }
.fext { font:700 10px var(--mono); letter-spacing:.03em; }
.file.loading .fic .i { visibility:hidden; }
.file.loading .fic::after { content:""; position:absolute; inset:9px; border:2px solid color-mix(in srgb, var(--accent-ink) 35%, transparent); border-top-color:var(--accent-ink); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.fname { font-weight:600; max-width:270px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fsize { font-size:12px; color:var(--muted); }
.poll { min-width:310px; }
.pq { font-weight:600; }
.pk { font-size:12px; color:var(--muted); margin-bottom:6px; }
.popt { display:grid; grid-template-columns:24px 1fr auto; align-items:center; width:100%; border:0; background:none; padding:7px 0 9px; text-align:left; position:relative; }
.popt:disabled { cursor:default; color:inherit; }
.pr { width:16px; height:16px; border-radius:50%; border:1.5px solid var(--faint); display:grid; place-items:center; }
.popt:not(:disabled):hover .pr { border-color:var(--accent); }
.poll.voted .pr { border:0; }
.popt.mine .pr { background:var(--accent); color:var(--accent-ink); }
.popt.mine .pr .i { width:12px; height:12px; stroke-width:2.2; }
.pp { display:none; font-size:13px; font-weight:600; }
.poll.voted .pp { display:block; }
.pbar { position:absolute; left:24px; bottom:2px; height:3px; border-radius:2px; width:0; background:var(--accent); transition:width .5s; }
.poll.voted .pbar { width:calc((100% - 24px) * var(--w) / 100); }
.ptot { text-align:center; font-size:12px; color:var(--muted); margin-top:4px; }
.kb { display:grid; gap:4px; margin-top:4px; }
.kbrow { display:flex; gap:4px; }
.kbb { flex:1; border:0; padding:8px; border-radius:7px; background:color-mix(in srgb, var(--accent) 16%, var(--in)); color:var(--text); font-weight:500; }
.kbb:hover { background:color-mix(in srgb, var(--accent) 26%, var(--in)); }

/* composer */
.replybar { display:flex; align-items:center; gap:10px; padding:6px 8px 0 16px; background:var(--win); border-top:1px solid var(--line); color:var(--accent); }
.replybar .quote { flex:1; margin:0; color:var(--text); }
.composer { display:flex; align-items:flex-end; gap:2px; padding:7px 8px; background:var(--win); border-top:1px solid var(--line); position:relative; z-index:1; }
.replybar:not([hidden]) + .composer { border-top:0; }
.composer textarea { flex:1; resize:none; border:0; outline:none; background:transparent; padding:7px 6px; height:34px; max-height:160px; line-height:20px; font-size:var(--msg); }
.sendb, .recb { width:36px; height:36px; border-radius:50%; border:0; display:grid; place-items:center; flex:none; }
.sendb { background:var(--accent); color:var(--accent-ink); }
.botmenu { width:auto; padding:0 10px; background:var(--accent); color:var(--accent-ink); font-size:13px; font-weight:600; height:30px; margin:2px 4px 2px 0; border-radius:15px; display:flex; gap:6px; align-items:center; }
.botmenu:hover { background:var(--accent); color:var(--accent-ink); filter:brightness(1.08); }
.botmenu .i { width:15px; height:15px; }
.recbar { display:none; flex:1; align-items:center; gap:12px; height:36px; padding:0 8px; }
.rdot { width:10px; height:10px; border-radius:50%; background:var(--bad); animation:blink 1s infinite; }
.rtime { font:13px var(--mono); }
.rhint { color:var(--muted); font-size:13px; margin-left:auto; }
.composer.recording > :not(.recbar):not(.recb):not(.pop) { display:none; }
.composer.recording .recbar { display:flex; padding-right:20px; }
.composer.recording .recb { background:var(--accent); color:var(--accent-ink); transform:scale(1.35); box-shadow:0 0 0 8px color-mix(in srgb, var(--accent) 22%, transparent); transition:transform .15s; }
.camprev { position:absolute; right:24px; bottom:16px; width:240px; height:240px; border-radius:50%; overflow:hidden; box-shadow:var(--shadow); border:3px solid var(--bad); z-index:3; }
.camprev svg { width:100%; height:100%; animation:pan 5s ease-in-out infinite alternate; }
.chanbar { background:var(--win); border-top:1px solid var(--line); padding:6px; }
.chanbar button { width:100%; border:0; background:none; color:var(--accent); font-weight:600; padding:9px; border-radius:6px; }
.chanbar button:hover { background:var(--sel); }
.pop { position:absolute; bottom:calc(100% + 6px); background:var(--win); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:5px; z-index:6; }
#attachpop { left:8px; }
#attachpop button, #botpop button { display:flex; gap:10px; align-items:center; width:100%; border:0; background:none; padding:8px 12px 8px 8px; border-radius:6px; text-align:left; white-space:nowrap; }
#attachpop button:hover, #botpop button:hover { background:var(--sel); }
#botpop { left:8px; min-width:240px; }
#botpop b { font-family:var(--mono); font-weight:500; color:var(--accent); min-width:60px; }
#botpop span { color:var(--muted); }
#emojipop { right:48px; width:318px; }
.etabs { display:flex; gap:2px; padding:2px 2px 6px; border-bottom:1px solid var(--line); margin-bottom:4px; }
.etabs button { border:0; background:none; padding:4px 10px; border-radius:6px; color:var(--muted); font-size:13px; }
.etabs button.on { background:var(--sel); color:var(--text); font-weight:600; }
.egrid { display:grid; grid-template-columns:repeat(8, 1fr); max-height:220px; overflow-y:auto; }
.egrid button { border:0; background:none; font-size:20px; height:36px; border-radius:6px; }
.egrid button:hover { background:var(--sel); }
.egrid.st { grid-template-columns:repeat(3, 1fr); }
.egrid.st button { height:96px; padding:6px; }
.egrid.st svg { width:100%; height:100%; }

/* info panel */
.info { width:0; overflow:hidden; background:var(--win); transition:width .2s; }
.app.showinfo .info { width:320px; border-left:1px solid var(--line); }
.info > div { width:320px; height:100%; display:grid; grid-template-rows:54px 1fr; }
.ihead { display:flex; align-items:center; justify-content:space-between; padding:0 8px 0 16px; border-bottom:1px solid var(--line); font-weight:600; }
.iscroll { overflow-y:auto; }
.iprof { display:grid; justify-items:center; gap:4px; padding:22px 16px 14px; text-align:center; }
.iprof .in { font-weight:600; font-size:17px; margin-top:8px; }
.iprof .is { font-size:13px; color:var(--muted); }
.irow { display:grid; grid-template-columns:22px 1fr; gap:2px 14px; padding:9px 18px; align-items:start; }
.irow .i { color:var(--muted); margin-top:2px; }
.irow small { grid-column:2; color:var(--muted); font-size:12px; }
.irow.tgl { grid-template-columns:22px 1fr auto; align-items:center; cursor:pointer; border-top:8px solid var(--pane); padding:12px 18px; }
.irow.tgl input { display:none; }
.itabs { display:flex; border-top:8px solid var(--pane); border-bottom:1px solid var(--line); }
.itabs button { flex:1; border:0; background:none; padding:10px 0 9px; font-size:13px; color:var(--muted); border-bottom:2px solid transparent; }
.itabs button.on { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
.igrid { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:2px; }
.igrid .ph { width:auto; aspect-ratio:1; border-radius:0; }
.ilist .file, .ilist .il { padding:8px 16px; }
.il { display:grid; gap:1px; font-size:13px; }
.il b { font-weight:600; }
.il span { color:var(--muted); }
.inone { padding:28px 16px; color:var(--muted); text-align:center; font-size:13px; }

/* switch */
.sw { width:34px; height:20px; border-radius:10px; background:var(--faint); position:relative; flex:none; transition:background .15s; }
.sw::after { content:""; position:absolute; top:3px; left:3px; width:14px; height:14px; border-radius:50%; background:#fff; transition:left .15s; }
input:checked + .sw { background:var(--accent); }
input:checked + .sw::after { left:17px; }

/* overlays */
.scrim { position:absolute; inset:0; background:rgba(0,0,0,.38); z-index:20; }
.drawer { position:absolute; top:0; bottom:0; left:0; width:290px; background:var(--win); z-index:21; transform:translateX(-102%); transition:transform .2s; display:flex; flex-direction:column; box-shadow:var(--shadow); }
.drawer.open { transform:none; }
.dprof { padding:20px 18px 14px; background:var(--pane); border-bottom:1px solid var(--line); }
.dprof .dn { font-weight:600; margin-top:12px; }
.dprof .dp { color:var(--muted); font-size:13px; }
.dnav { padding:6px 0; flex:1; overflow-y:auto; }
.ditem { display:flex; align-items:center; gap:16px; width:100%; border:0; background:none; padding:10px 20px; text-align:left; }
.ditem:hover { background:var(--sel); }
.ditem .i { color:var(--muted); }
label.ditem input { display:none; }
label.ditem .sw { margin-left:auto; }
.dfoot { padding:12px 20px; color:var(--muted); font-size:12px; border-top:1px solid var(--line); }

.mwrap { position:absolute; inset:0; display:grid; place-items:center; background:rgba(0,0,0,.38); z-index:30; }
.modal { width:470px; height:min(680px, calc(100% - 40px)); background:var(--win); border-radius:12px; display:grid; grid-template-rows:52px 1fr; overflow:hidden; box-shadow:var(--shadow); }
.mhead { display:flex; align-items:center; gap:6px; padding:0 8px; border-bottom:1px solid var(--line); }
.mhead h3 { flex:1; margin:0; font-size:16px; font-weight:600; }
.mbody { overflow-y:auto; overflow-x:hidden; }
.sgroup { padding:6px 0; border-bottom:8px solid var(--pane); }
.sgroup:last-child { border-bottom:0; }
.sgroup h4 { margin:8px 18px 4px; font-size:13px; color:var(--accent); font-weight:600; }
.snote { margin:4px 18px 8px; font-size:13px; color:var(--muted); }
.srow { display:flex; align-items:center; gap:16px; width:100%; padding:10px 18px; border:0; background:none; text-align:left; font-size:14px; min-height:44px; }
button.srow:hover, label.srow:hover { background:var(--sel); }
label.srow { cursor:pointer; }
.srow.static { cursor:default; }
.srow > .i { color:var(--muted); }
.srow .sl { flex:1; min-width:0; }
.srow .sl small { display:block; color:var(--muted); font-size:13px; margin-top:1px; }
.srow .sv { color:var(--accent); font-size:13px; white-space:nowrap; }
.srow .chv { color:var(--faint); width:16px; height:16px; }
.srow.danger, .srow.danger .i { color:var(--bad); }
.srow.accent { color:var(--accent); font-weight:600; justify-content:center; }
.srow input[type=checkbox] { display:none; }
.srow input[type=radio] { width:18px; height:18px; margin:0; accent-color:var(--accent); flex:none; }
.srow .ord { font-family:var(--mono); color:var(--faint); width:14px; }
.srow .dot { margin:0 5px 0 0; }
.sbtn { border:1px solid var(--line); background:var(--win); border-radius:6px; padding:4px 12px; font-size:13px; }
.sbtn:hover { border-color:var(--accent); color:var(--accent); }
.sbtn.pri { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.sbtn.pri:hover { color:var(--accent-ink); filter:brightness(1.08); }
.sprof { display:flex; gap:16px; align-items:center; padding:18px; }
.sprof .spn { font-size:17px; font-weight:600; }
.sprof .sps { color:var(--muted); font-size:13px; }
.sfield { padding:4px 18px 10px; }
.sfield input, .sfield textarea { width:100%; border:0; border-bottom:1.5px solid var(--line); background:none; padding:6px 0; outline:none; font-size:15px; resize:none; }
.sfield input:focus, .sfield textarea:focus { border-color:var(--accent); }
.sfield .pre { display:flex; align-items:center; gap:2px; }
.sfield .pre span { color:var(--muted); font-size:15px; }
.sfield .cnt { text-align:right; font-size:12px; color:var(--muted); }
.swatches { display:flex; gap:12px; padding:8px 18px 12px; }
.sw8 { width:34px; height:34px; border-radius:50%; border:0; position:relative; }
.sw8.on::after { content:""; position:absolute; inset:-4px; border-radius:50%; border:2px solid var(--text); }
.srange { display:flex; align-items:center; gap:14px; padding:6px 18px 12px; }
.srange input { flex:1; accent-color:var(--accent); }
.srange span { font:13px var(--mono); color:var(--muted); width:42px; text-align:right; }
.store { display:flex; height:10px; border-radius:5px; overflow:hidden; margin:10px 18px 6px; background:var(--pane); }
.store i { display:block; height:100%; }
.legend { display:grid; grid-template-columns:1fr 1fr; gap:4px 16px; padding:4px 18px 8px; font-size:13px; }
.legend span { display:flex; align-items:center; gap:8px; }
.legend i { width:10px; height:10px; border-radius:3px; }
.legend b { margin-left:auto; font-weight:500; color:var(--muted); font-variant-numeric:tabular-nums; }
.pxform { display:grid; grid-template-columns:110px minmax(0,1fr) 80px; gap:8px; padding:4px 18px 8px; }
.pxform label { display:grid; gap:3px; font-size:12px; color:var(--muted); }
.pxform label.wide { grid-column:1 / -1; }
.pxform input, .pxform select { width:100%; min-width:0; border:1px solid var(--line); background:var(--win); border-radius:6px; padding:6px 8px; font:13px var(--mono); color:var(--text); outline:none; }
.pxform input:focus { border-color:var(--accent); }
.pxbtns { display:flex; gap:8px; padding:2px 18px 12px; }
.about { display:grid; justify-items:center; gap:4px; padding:22px 18px 16px; text-align:center; }
.mark { width:56px; height:56px; border-radius:12px; background:var(--text); color:var(--win); display:grid; place-items:center; font:600 18px var(--mono); }
.about .an { font-weight:600; font-size:17px; margin-top:8px; }
.about .av { color:var(--muted); font:13px var(--mono); }
.callrow .i.missed { color:var(--bad); }
.callrow .i.inc { color:var(--ok); }
.ckb { width:18px; height:18px; accent-color:var(--accent); margin:0; }
label.srow input.ckb { display:block; }

.viewer { position:absolute; inset:0; background:rgba(8,9,8,.94); z-index:40; display:grid; grid-template-rows:54px 1fr auto; color:#eee; }
.vtop { display:flex; align-items:center; gap:12px; padding:0 10px 0 18px; }
.vtop .vw { flex:1; line-height:1.25; }
.vtop .vw span { display:block; font-size:13px; color:#aaa; }
.vtop .ib { color:#ccc; }
.vtop .ib:hover { background:rgba(255,255,255,.1); color:#fff; }
.vstage { display:grid; place-items:center; min-height:0; padding:10px; }
.vimg { width:min(88%, 1000px); max-height:100%; aspect-ratio:var(--ar); }
.vimg svg { width:100%; height:100%; display:block; border-radius:4px; }
.vcap { text-align:center; padding:10px 20px 18px; color:#ddd; }

.ctx { position:fixed; z-index:50; background:var(--win); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:4px; min-width:210px; }
.ctx .rx { display:flex; gap:2px; padding:2px 2px 5px; margin-bottom:3px; border-bottom:1px solid var(--line); }
.ctx .rx button { border:0; background:none; width:32px; height:32px; border-radius:8px; font-size:18px; }
.ctx .rx button:hover { background:var(--sel); transform:scale(1.12); }
.ctx .ci { display:flex; gap:12px; align-items:center; width:100%; border:0; background:none; padding:7px 10px; border-radius:6px; text-align:left; }
.ctx .ci:hover { background:var(--sel); }
.ctx .ci .i { color:var(--muted); }
.ctx .ci.danger, .ctx .ci.danger .i { color:var(--bad); }
.ctx .ci.off { color:var(--faint); pointer-events:none; }

.toast { position:absolute; left:50%; bottom:22px; transform:translate(-50%, 10px); background:#262826; color:#f1f0ec; padding:8px 16px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:60; white-space:nowrap; }
.toast.show { opacity:1; transform:translate(-50%, 0); }
.wtoast { position:absolute; right:16px; bottom:16px; width:330px; background:var(--win); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:8px; padding:10px 12px 12px; display:grid; grid-template-columns:40px 1fr; gap:2px 10px; z-index:45; cursor:pointer; animation:slidein .25s; }
@keyframes slidein { from { transform:translateY(20px); opacity:0; } }
.wtoast .wa { grid-column:1 / -1; font-size:11.5px; color:var(--muted); margin-bottom:6px; display:flex; justify-content:space-between; }
.wtoast .ava { grid-row:span 2; }
.wtoast b { font-weight:600; }
.wtoast span { font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* login */
.login { position:absolute; inset:0; background:var(--win); z-index:35; display:grid; place-items:center; overflow-y:auto; }
.lcard { width:360px; padding:24px 0; }
.lcard .mark { margin-bottom:22px; width:48px; height:48px; border-radius:10px; font-size:16px; }
.lcard h2 { margin:0 0 6px; font-size:22px; font-weight:600; }
.lcard p { margin:0 0 20px; color:var(--muted); }
.steps { display:flex; gap:6px; margin-bottom:22px; font-size:12px; color:var(--muted); }
.steps span { flex:1; border-top:2px solid var(--line); padding-top:6px; }
.steps span.on { border-color:var(--accent); color:var(--text); }
.steps span.done { border-color:var(--accent); }
.field { display:grid; gap:4px; font-size:12px; color:var(--muted); }
.field input { border:1px solid var(--line); background:var(--win); border-radius:6px; padding:9px 10px; font-size:15px; outline:none; color:var(--text); }
.field input:focus { border-color:var(--accent); }
.field input.mono { font-family:var(--mono); }
.phone { display:grid; grid-template-columns:86px 1fr; gap:8px; }
.btn { height:40px; padding:0 14px; border-radius:6px; border:1px solid var(--line); background:var(--win); width:100%; margin-top:16px; }
.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
.lerr { color:var(--bad); font-size:13px; margin-top:8px; min-height:18px; }
.alt { margin-top:14px; font-size:13px; text-align:center; color:var(--muted); }
.code { display:flex; gap:8px; }
.code input { width:54px; height:58px; text-align:center; font:600 24px var(--mono); border:1px solid var(--line); border-radius:8px; background:var(--win); outline:none; color:var(--text); }
.code input:focus { border-color:var(--accent); }
.qrbox { width:220px; height:220px; padding:12px; background:#fff; border-radius:10px; margin:6px auto 18px; border:1px solid var(--line); }
.qrsteps { margin:0 0 4px; padding-left:20px; color:var(--muted); font-size:13px; line-height:1.7; }
.lroute { margin-top:30px; padding-top:14px; border-top:1px solid var(--line); font:12px var(--mono); color:var(--muted); }
.shake { animation:shake .3s; }
@keyframes shake { 25% { transform:translateX(-6px); } 75% { transform:translateX(6px); } }

/* status bar */
.status { border-top:1px solid var(--line); display:flex; align-items:center; gap:18px; padding:0 10px; font:12px/1 var(--mono); color:var(--muted); background:var(--pane); white-space:nowrap; cursor:pointer; overflow:hidden; }
.status:hover { background:var(--sel); }
.status b { color:var(--text); font-weight:500; }
.dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; vertical-align:1px; flex:none; }
.dot.ok { background:var(--ok); } .dot.warn { background:var(--warn); } .dot.bad { background:var(--bad); }
.dot.off { border:1px solid var(--faint); }

/* locally saved deleted messages, edit history, bookmarks */

.ds { flex:1; min-height:0; overflow:auto; scroll-behavior:smooth; }

function progress(el, pos) {
  const dur = +el.dataset.dur, f = Math.min(1, pos / dur);
  if (el.classList.contains("voice")) {
    const bars = $$(".wave i", el), k = Math.round(f * bars.length);
    bars.forEach((b, i) => b.classList.toggle("on", i < k));
    $(".vtime", el).textContent = pos > 0 ? fmtDur(pos) : fmtDur(dur);
  } else {

  pause();

  let pos = +el.dataset.pos;
  el.classList.add("playing");
  playing = { el, timer: setInterval(() => {
    pos += .1 * (+el.dataset.speed || 1);
    if (pos >= +el.dataset.dur) { el.dataset.pos = 0; progress(el, 0); pause(); return; }
    el.dataset.pos = pos; progress(el, pos);
  }, 100) };
}

function wdiff(a, b) {
  const x = a.split(" "), y = b.split(" "); let i = 0, j = 0;
  while (i < x.length && i < y.length && x[i] === y[i]) i++;
  while (j < x.length - i && j < y.length - i && x[x.length - 1 - j] === y[y.length - 1 - j]) j++;
  const mid = arr => arr.slice(i, arr.length - j).join(" ");
  return [esc(x.slice(0, i).join(" ")), mid(x) ? `<del>${esc(mid(x))}</del>` : "", mid(y) ? `<ins>${esc(mid(y))}</ins>` : "", esc(x.slice(x.length - j).join(" "))].filter(Boolean).join(" ");
}

/* four-digit inputs: passcode setup and lock screen */
function pinHandlers(host, sel, done) {
  host.addEventListener("input", e => {
    const box = e.target.closest(sel); if (!box) return;
    const ins = $$("input", box), i = ins.indexOf(e.target);
    e.target.value = e.target.value.replace(/\D/g, "");
    if (e.target.value && ins[i + 1]) ins[i + 1].focus();
    if (ins.every(x => x.value)) done(ins.map(x => x.value).join(""), box);
  });

dsEl.addEventListener("click", e => {
  const a = e.target.closest("[data-ds]"); if (a) { e.preventDefault(); const s = $("#ds-" + a.dataset.ds); s && s.scrollIntoView(); return; }
  const j = e.target.closest("[data-jump]"); if (j) jump(j.dataset.jump);
});

/* ---------- init ---------- */
(function init() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.has("dark")) S.theme = "dark";
  if (h.has("light")) S.theme = "light";
  if (h.get("chat") && chatOf(h.get("chat"))) state.chat = h.get("chat");
  if (h.has("info")) state.info = true;
  applySettings();
  syncComposer();
  openChat(state.chat);
  connect();
  if (h.has("login")) { state.loggedIn = false; renderLogin(h.get("login") || "phone"); }
  if (h.get("settings")) openSettings(h.get("settings"));
  if (h.has("drawer")) openDrawer();
  if (h.has("search")) openSearch(h.get("search") || "");
  if (h.has("lock")) { S.pass = S.pass || "0000"; lockApp(); }
  if (h.get("call")) startCall(chatOf("anton"), h.get("call"));
  if (h.has("offline")) setOffline();
  if (h.has("compact")) { S.compact = true; applySettings(); }
  if (h.has("ds")) setView("ds", h.get("ds"));
  scheduleLife();
})();
</script>
